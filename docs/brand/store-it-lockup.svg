<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="store-it">
  <defs>
    <linearGradient id="storeit-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9C93" />
      <stop offset="1" stop-color="#6FA8D6" />
    </linearGradient>
  </defs>
  <!-- mark (40px tile) -->
  <g transform="translate(2,4) scale(0.8333)">
    <rect width="48" height="48" rx="11" fill="url(#storeit-g)" />
    <g fill="#fff">
      <rect x="10" y="9" width="28" height="9" rx="3.5" />
      <rect x="10" y="19.5" width="28" height="9" rx="3.5" opacity="0.82" />
      <rect x="10" y="30" width="28" height="9" rx="3.5" opacity="0.64" />
    </g>
    <g fill="#2c7b73">
      <rect x="21.5" y="12.3" width="5" height="2.6" rx="1.3" />
      <rect x="21.5" y="22.8" width="5" height="2.6" rx="1.3" opacity="0.85" />
      <rect x="21.5" y="33.3" width="5" height="2.6" rx="1.3" opacity="0.7" />
    </g>
  </g>
  <!-- wordmark (outline the text for pixel-fixed rendering; uses a sans stack otherwise) -->
  <text x="52" y="32" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6">
    <tspan fill="#16343A">store</tspan><tspan fill="#3E9C93">-it</tspan>
  </text>
</svg>
