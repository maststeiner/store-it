# KAIFe DoD gates as CI stages — technology-independent template.
# Replace every "TODO" step with your stack's commands (see docs/SETUP.md).
# Trivy (Security) and SonarQube (Quality) are language-neutral and need only configuration.

trigger:
  branches:
    exclude:
      - main  # PRs only (Build Validation Policy)

pool:
  vmImage: 'ubuntu-latest'

variables:
  coverageThreshold: 70  # Calibrate during pilot

stages:

