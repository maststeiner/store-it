    - script: echo "TODO: enforce coverage >= $(coverageThreshold)%" && exit 1
      displayName: 'TODO: Coverage gate ≥ $(coverageThreshold)%'

# ──────────────────────────────────────────────
# Stage 2: Security Scan + SBOM (Trivy — language-neutral)
# ──────────────────────────────────────────────
- stage: Security
  displayName: '2 · Security & SBOM'
  dependsOn: BuildAndTest
  jobs:
  - job: Trivy
    steps:
    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      displayName: 'Install Trivy'

    - script: |
        trivy fs . \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --format table
      displayName: 'Trivy: Dependency + Secret scan'

    - script: |
        trivy fs . \
          --format cyclonedx \
          --output sbom.cdx.json
      displayName: 'Trivy: SBOM export (CycloneDX)'

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'sbom.cdx.json'
        artifactName: 'SBOM'
      displayName: 'Publish SBOM as pipeline artifact'

