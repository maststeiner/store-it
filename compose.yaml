# Local development database (podman compose up -d / docker compose up -d).
# Dev/prod parity: real PostgreSQL, no in-memory substitute (coding guidelines, ADR-003).
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: storeit
      POSTGRES_USER: storeit
      POSTGRES_PASSWORD: storeit # local development only — never reuse
    ports:
      # bind to loopback only — do not expose the dev DB on all host interfaces
      - '127.0.0.1:5432:5432'
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data: since 18 these images keep the
      # cluster in a version-specific subdirectory and refuse to start when a volume sits
      # at the old path — this container exited 1 on every `up` until the mount moved.
      # An existing pgdata volume from before is not readable at the new path; remove it
      # (`docker volume rm store-it_pgdata`) and let migrations rebuild the local database.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
