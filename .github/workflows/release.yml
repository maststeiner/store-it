# SPEC-005 — publish release images (ADR-005 decision 6).
#
# Triggered by the release marker of ADR-007 only: an annotated vMAJOR.MINOR.PATCH tag. Pull
# requests and pushes to develop/main publish nothing (SPEC-005 AC-04); that is ci.yml's job.
#
# Three images, two architectures, one manifest each:
#   ghcr.io/<owner>/store-it-backend   backend/Dockerfile  target runtime
#   ghcr.io/<owner>/store-it-migrate   backend/Dockerfile  target migrate   (same build → same migrations, AC-03)
#   ghcr.io/<owner>/store-it-web       frontend/Dockerfile
#
# Each architecture builds natively on its own runner (no QEMU: a .NET publish under
# emulation is slow and flaky) and pushes UNTAGGED, by digest. Only the final job stitches
# the digests into tagged multi-arch manifests — so a failed build on either architecture
# leaves no half-published version behind (AC-06). Version tag + `latest` (AC-01, D2).

name: Release

# Least privilege at workflow level; the jobs that push images raise packages to write.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  # Image names are decision D6 of SPEC-005; the deployment repository defaults to them.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/store-it

jobs:
  # ────────────────────────────────────────────
  # 1 · Build per architecture, push by digest
  # ────────────────────────────────────────────
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Free for public repositories (GitHub changelog 2025-08-07).
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # AC-05: the workflow token, nothing long-lived

      # OCI labels (AC-07) — identical for the three images except the title. Version is the
      # tag, revision the commit it points at, source the repository.
      - name: Compose OCI labels
        id: labels
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "common<<EOF"
            echo "org.opencontainers.image.source=${SOURCE}"
            echo "org.opencontainers.image.revision=${REVISION}"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.licenses=MIT"
            echo "org.opencontainers.image.vendor=store-it"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build backend (runtime)
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.labels.outputs.common }}
            org.opencontainers.image.title=store-it-backend
            org.opencontainers.image.description=store-it API (.NET)
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-backend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

      # Same Dockerfile, same cache scope → the `build` stage is reused, not rebuilt: migrate
      # and backend can never disagree about which migrations exist (AC-03).
      - name: Build migrate
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: migrate
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.labels.outputs.common }}
            org.opencontainers.image.title=store-it-migrate
            org.opencontainers.image.description=store-it EF Core migration runner (one-shot admin process)
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-migrate,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

      - name: Build web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.labels.outputs.common }}
            org.opencontainers.image.title=store-it-web
            org.opencontainers.image.description=store-it web client (nginx + Angular bundle, proxies /api and /auth)
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

      # One empty file per digest, grouped by image — the merge job reads the file names.
      - name: Export digests
        env:
          BACKEND: ${{ steps.backend.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          set -eu
          for pair in "backend:${BACKEND}" "migrate:${MIGRATE}" "web:${WEB}"; do
            image="${pair%%:*}"; digest="${pair#*:}"
            [ -n "${digest}" ] || { echo "no digest for ${image}"; exit 1; }
            mkdir -p "/tmp/digests/${image}"
            touch "/tmp/digests/${image}/${digest#sha256:}"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────
  # 2 · Merge into tagged multi-arch manifests
  # ────────────────────────────────────────────
  publish:
    name: Publish manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests (vX.Y.Z + latest)
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          for image in backend migrate web; do
            name="${IMAGE_PREFIX}-${image}"
            dir="/tmp/digests/${image}"
            count="$(find "${dir}" -type f | wc -l)"
            [ "${count}" -eq 2 ] || { echo "${image}: expected 2 digests (amd64+arm64), found ${count}"; exit 1; }
            # shellcheck disable=SC2046
            docker buildx imagetools create \
              --tag "${name}:${VERSION}" \
              --tag "${name}:latest" \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --annotation "index:org.opencontainers.image.revision=${REVISION}" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              $(printf "${name}@sha256:%s " $(ls "${dir}"))
          done

      - name: Show what was published
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for image in backend migrate web; do
            docker buildx imagetools inspect "${IMAGE_PREFIX}-${image}:${VERSION}"
          done
