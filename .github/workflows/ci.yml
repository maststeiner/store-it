# KAIFe DoD gates as CI jobs (Gate G3 machine part).
# NOTE: backend/ and frontend/ jobs go green once the respective scaffold lands.

name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  COVERAGE_THRESHOLD: 70 # Calibrate during pilot

jobs:

  # ────────────────────────────────────────────
  # 1 · Build & Test
  # ────────────────────────────────────────────
  backend-build-test:
    name: 1 · Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build --configuration Release
      # Coverage gate configured in backend/tests/Directory.Build.props
      # (threshold 70%, architecture tests excluded)
      - name: Test + coverage gate
        run: dotnet test --configuration Release

  frontend-build-test:
    name: 1 · Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test + coverage
        # Vitest builder runs in Node/jsdom (no browser needed); watch is off in CI.
        # TODO: enforce coverage threshold ($COVERAGE_THRESHOLD) via vitest config once real components exist.
        run: npm test -- --coverage
      - name: Build
        run: npm run build

  # ────────────────────────────────────────────
  # 2 · Security & SBOM (Trivy — language-neutral)
  # ────────────────────────────────────────────
  security:
    name: 2 · Security scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Dependency + secret scan
        run: |
          trivy fs . \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table
      - name: SBOM export (CycloneDX)
        run: |
          trivy fs . \
            --format cyclonedx \
            --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: SBOM
          path: sbom.cdx.json

  # ────────────────────────────────────────────
  # 3 · Code Quality (SonarQube/SonarCloud)
  # ────────────────────────────────────────────
  # TODO: activate once a SonarCloud project + SONAR_TOKEN secret exist.
  # quality:
  #   name: 3 · SonarCloud quality gate
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - uses: SonarSource/sonarcloud-github-action@master
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ────────────────────────────────────────────
  # 4 · Architecture Conformance
  # ────────────────────────────────────────────
  architecture:
    name: 4 · Architecture gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Layering rules (0 violations)
        # CollectCoverage=false: the coverage gate belongs to job 1; with this filter
        # other test projects run 0 tests and would fail the threshold spuriously.
        run: dotnet test --filter "Category=ArchitectureTests" --configuration Release /p:CollectCoverage=false

  # ────────────────────────────────────────────
  # 5 · Format & Lint
  # ────────────────────────────────────────────
  format-backend:
    name: 5 · Backend format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: dotnet format
        run: dotnet format --verify-no-changes

  format-frontend:
    name: 5 · Frontend format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier check
        # npm ci first so the pinned prettier version is used (npx without
        # node_modules would fetch the latest version → formatting drift)
        run: npx prettier --check .
