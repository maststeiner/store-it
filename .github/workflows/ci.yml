# KAIFe DoD gates as CI jobs (Gate G3 machine part).
# NOTE: backend/ and frontend/ jobs go green once the respective scaffold lands.

name: CI

# Least privilege: these jobs only read code (build, test, scan, format-check)
permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main] # post-merge runs keep the SonarCloud baseline current
  workflow_dispatch:

env:
  COVERAGE_THRESHOLD: 70 # Calibrate during pilot

jobs:

  # ────────────────────────────────────────────
  # 1 · Build & Test
  # ────────────────────────────────────────────
  backend-build-test:
    name: 1 · Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build --configuration Release
      # Coverage gate configured in backend/tests/Directory.Build.props
      # (threshold 70%, architecture tests excluded)
      - name: Test + coverage gate
        run: dotnet test --configuration Release

  backend-mutation-test:
    name: 1a · Backend mutation testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - name: Restore tools
        run: dotnet tool restore
      # Verifies the tests actually test something (kills mutants) — AI-generated
      # tests can look plausible while asserting nothing. Break threshold: 60%.
      - name: Stryker mutation testing
        run: dotnet stryker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: backend/StrykerOutput/**/reports/
          if-no-files-found: ignore

  frontend-build-test:
    name: 1 · Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test + coverage gate
        # Vitest builder in Node/jsdom (no browser needed); line-coverage threshold
        # (70%) enforced via vitest-base.config.ts, consistent with the backend gate.
        run: npm run test:coverage
      - name: Build
        run: npm run build

  # ────────────────────────────────────────────
  # 2 · Security & SBOM (Trivy — language-neutral)
  # ────────────────────────────────────────────
  e2e:
    name: 1b · End-to-end (full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: storeit
          POSTGRES_USER: storeit
          POSTGRES_PASSWORD: storeit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ConnectionStrings__storeit: Host=localhost;Port=5432;Database=storeit;Username=storeit;Password=storeit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Apply migrations (admin process, 12-factor)
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef database update --project src/StoreIt.Infrastructure --startup-project src/StoreIt.Api
      - name: Start backend
        working-directory: backend
        run: |
          dotnet run --project src/StoreIt.Api --configuration Release --no-launch-profile --urls http://localhost:5000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then echo "backend up"; break; fi
            sleep 2
          done
      - name: Install frontend deps + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E (Playwright starts ng serve, proxies to backend)
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  security:
    name: 2 · Security scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Dependency + secret + license scan
        # Licenses: forbidden/restricted (GPL/AGPL/etc.) map to HIGH/CRITICAL in
        # Trivy's default categorization — see docs/SETUP.md license policy.
        run: |
          trivy fs . \
            --scanners vuln,secret,license \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table

      - name: SBOM export (CycloneDX)
        run: |
          trivy fs . \
            --format cyclonedx \
            --output sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SBOM
          path: sbom.cdx.json

  api-contract:
    name: 2 · API contract gate (drift + breaking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      # ADR-006 stage 1 — drift: the committed contract must match the code
      - name: Regenerate OpenAPI spec
        run: dotnet build src/StoreIt.Api --configuration Release
      - name: Drift check (contract committed and current)
        run: git diff --exit-code -- openapi/
      # ADR-006 stage 2 — breaking changes vs. target branch (PRs only)
      - name: Install oasdiff
        if: github.event_name == 'pull_request'
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v1.23.0/oasdiff_1.23.0_linux_amd64.tar.gz" -o /tmp/oasdiff.tgz
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
      - name: Breaking-change check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:backend/openapi/StoreIt.Api.json" > /tmp/base-spec.json 2>/dev/null; then
            /tmp/oasdiff breaking /tmp/base-spec.json openapi/StoreIt.Api.json --fail-on ERR
          else
            echo "No contract on ${BASE_REF} yet — first introduction, skipping breaking check."
          fi

  dependency-review:
    name: 2 · Dependency & license review (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          # License policy (docs/SETUP.md): permissive licenses only
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0

  # ────────────────────────────────────────────
  # 3 · Code Quality (SonarCloud — monorepo: one project per app)
  # Requires SONAR_TOKEN secret + SonarCloud projects (see docs/SETUP.md §3).
  # sonar.qualitygate.wait=true → job fails when the quality gate is red
  # (duplication threshold, new blockers — counters the AI tech-debt risk).
  # ────────────────────────────────────────────
  quality-backend:
    name: 3 · Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # full history for accurate new-code detection
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21' # required by the Sonar scanner for .NET
      - name: Install scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"maststeiner_store-it-backend" \
            /o:"maststeiner" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true
          dotnet build --configuration Release
          dotnet test --configuration Release /p:CoverletOutputFormat=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  quality-frontend:
    name: 3 · Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=maststeiner_store-it-frontend
            -Dsonar.organization=maststeiner
            -Dsonar.sources=src
            -Dsonar.qualitygate.wait=true
        # TODO: wire vitest lcov coverage into the scan
        # (-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info) once paths are verified

  # ────────────────────────────────────────────
  # 4 · Architecture Conformance
  # ────────────────────────────────────────────
  architecture:
    name: 4 · Architecture gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      - name: Layering rules (0 violations)
        # CollectCoverage=false: the coverage gate belongs to job 1; with this filter
        # other test projects run 0 tests and would fail the threshold spuriously.
        run: dotnet test --filter "Category=ArchitectureTests" --configuration Release /p:CollectCoverage=false

  # ────────────────────────────────────────────
  # 5 · Format & Lint
  # ────────────────────────────────────────────
  format-backend:
    name: 5 · Backend format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x'
      # CSharpier owns formatting; Roslyn analyzers are enforced at build time (job 1)
      - name: Restore tools
        run: dotnet tool restore
      - name: CSharpier check
        run: dotnet csharpier check .

  workflow-lint:
    name: 5 · Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: actionlint
        # Installer pinned to the immutable v1.7.12 tag commit (not mutable main)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  format-frontend:
    name: 5 · Frontend format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier check
        # npm ci first so the pinned prettier version is used (npx without
        # node_modules would fetch the latest version → formatting drift)
        run: npx prettier --check .
