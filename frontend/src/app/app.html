<header>
  <!-- "store-it" is the invariant product/brand name — identical in every locale,
       so it is intentionally not routed through the TranslateService. -->
  <a class="logo" routerLink="/storages">
    <img class="logo-mark" src="/logo.svg" alt="" width="30" height="30" />
    store-it
  </a>
  <nav>
    <a routerLink="/storages" routerLinkActive="active">{{ 'nav.storages' | translate }}</a>
  </nav>
  <div class="header-right">
    <select
      class="lang"
      [ngModel]="language.current()"
      (ngModelChange)="language.set($event)"
      [attr.aria-label]="'header.language' | translate"
    >
      @for (lang of language.supported; track lang) {
        <option [value]="lang">{{ 'languages.' + lang | translate }}</option>
      }
    </select>
    @if (auth.user(); as u) {
      <span class="session-user">{{
        'auth.session.signedInAs' | translate: { name: (u.displayName ?? u.email) ?? '' }
      }}</span>
      <button class="btn btn-secondary btn-sm" type="button" (click)="auth.logout()">
        {{ 'auth.session.logout' | translate }}
      </button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
