# SPEC-004 — single-origin front door for the local stack.
#
# Everything the browser talks to is this server: static Angular assets, plus /api and
# /auth proxied to the API. One origin means no CORS, and it means the SPEC-003 session
# cookie and the X-XSRF-TOKEN double-submit pair are same-origin by construction (AC-07).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API builds its OIDC redirect_uri from the incoming request, so the browser's
    # Host must survive the hop — otherwise the callback would point at the internal
    # service name instead of localhost (SPEC-004 EC-02).
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OIDC sign-in bounces through the provider; do not let nginx give up early.
        proxy_read_timeout 60s;
    }

    # Health and the OpenAPI document live at the root of the API, not under /api.
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $http_host;
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build artefacts are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
